<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Anti-Kenzo Club</title>
    <style>
        :root {
            --bg: #070b17;
            --bg-2: #111d33;
            --panel: rgba(10, 17, 31, 0.78);
            --panel-border: rgba(103, 170, 255, 0.35);
            --text: #eef6ff;
            --muted: #a9bbd6;
            --accent: #5ef2ff;
            --accent-2: #7a86ff;
            --danger: #ff5f7d;
            --success: #8cff9b;
            --shadow: 0 15px 40px rgba(24, 53, 94, 0.45);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Rajdhani", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(94, 242, 255, 0.18), transparent 25%),
                radial-gradient(circle at bottom right, rgba(122, 134, 255, 0.2), transparent 30%),
                linear-gradient(135deg, var(--bg) 0%, #0d1324 40%, var(--bg-2) 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 18px;
        }

        .shell {
            width: min(1100px, 100%);
            min-height: 700px;
            background: rgba(10, 14, 26, 0.7);
            border: 1px solid var(--panel-border);
            border-radius: 28px;
            box-shadow: var(--shadow);
            overflow: hidden;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .shell::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(94, 242, 255, 0.05), transparent 35%, rgba(255, 95, 125, 0.06));
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            min-height: 700px;
        }

        .left {
            padding: 52px 54px 42px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border: 1px solid rgba(94, 242, 255, 0.5);
            border-radius: 999px;
            background: rgba(94, 242, 255, 0.08);
            color: var(--accent);
            font-size: 0.74rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 700;
            width: fit-content;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 16px var(--accent);
        }

        h1 {
            margin: 22px 0 14px;
            font-family: "Orbitron", sans-serif;
            font-size: clamp(3rem, 5vw, 5rem);
            line-height: 0.95;
            letter-spacing: 0.04em;
        }

        h1 span {
            color: var(--accent);
            text-shadow: 0 0 18px rgba(94, 242, 255, 0.6);
        }

        .lead {
            max-width: 560px;
            margin: 0 0 28px;
            color: var(--muted);
            font-size: 1.3rem;
            line-height: 1.5;
        }

        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .stat {
            min-width: 120px;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.02);
            border-radius: 18px;
        }

        .stat strong {
            display: block;
            font-size: 1.8rem;
            font-family: "Orbitron", sans-serif;
            color: var(--accent);
        }

        .stat span {
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.7rem;
        }

        .right {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px;
            background: linear-gradient(180deg, rgba(18, 27, 45, 0.7), rgba(7, 11, 23, 0.9));
            border-left: 1px solid rgba(255, 255, 255, 0.08);
        }

        .card {
            width: min(100%, 390px);
            border: 1px solid rgba(122, 134, 255, 0.35);
            border-radius: 26px;
            background: rgba(8, 13, 24, 0.9);
            box-shadow: 0 20px 40px rgba(2, 6, 18, 0.55);
            padding: 28px 22px 22px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card-header h2 {
            margin: 0;
            font-size: 1.5rem;
            font-family: "Orbitron", sans-serif;
        }

        .chip {
            border: 1px solid rgba(255, 95, 125, 0.5);
            background: rgba(255, 95, 125, 0.1);
            color: #ffc4d0;
            border-radius: 999px;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            padding: 7px 10px;
        }

        form {
            display: grid;
            gap: 14px;
        }

        .field {
            display: grid;
            gap: 7px;
        }

        label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--muted);
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        input::placeholder {
            color: rgba(169, 187, 214, 0.7);
        }

        input:focus {
            border-color: rgba(94, 242, 255, 0.7);
            box-shadow: 0 0 0 3px rgba(94, 242, 255, 0.12);
        }

        button {
            margin-top: 8px;
            border: none;
            border-radius: 14px;
            padding: 15px 18px;
            font-family: "Orbitron", sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.13em;
            text-transform: uppercase;
            color: var(--bg);
            background: linear-gradient(135deg, var(--accent), #97ffce);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 12px 30px rgba(94, 242, 255, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 35px rgba(94, 242, 255, 0.35);
        }

        .result {
            min-height: 52px;
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.02);
            color: var(--muted);
            font-weight: 600;
            line-height: 1.5;
        }

        .result.success {
            border-color: rgba(140, 255, 155, 0.5);
            background: rgba(140, 255, 155, 0.08);
            color: var(--success);
        }

        .result.error {
            border-color: rgba(255, 95, 125, 0.5);
            background: rgba(255, 95, 125, 0.08);
            color: #ffc0cf;
        }

        .reactor {
            position: absolute;
            right: 120px;
            top: 60px;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(94, 242, 255, 0.55) 0%, rgba(94, 242, 255, 0.16) 30%, rgba(94, 242, 255, 0.02) 65%, transparent 70%);
            filter: blur(4px);
            opacity: 0.8;
            pointer-events: none;
        }

        @media (max-width: 820px) {
            .content {
                grid-template-columns: 1fr;
            }

            .right {
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.08);
                padding-top: 18px;
            }

            .left {
                padding: 30px 24px 12px;
            }

            .reactor {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <div class="reactor"></div>
        <div class="content">
            <section class="left">
                <div class="badge"><span class="dot"></span> Operation: Resistance</div>
                <h1>Anti-<span>Kenzo</span> Club</h1>
                <p class="lead">A bold circle of students who reject chaos, corruption, and every dramatic act of evil. Join the movement and stand together against Kenzo's rule.</p>

                <div class="stats">
                    <div class="stat">
                        <strong>06</strong>
                        <span>Core members</span>
                    </div>
                    <div class="stat">
                        <strong>24/7</strong>
                        <span>Watchdog mode</span>
                    </div>
                    <div class="stat">
                        <strong>∞</strong>
                        <span>Resistance</span>
                    </div>
                </div>
            </section>

            <aside class="right">
                <div class="card">
                    <div class="card-header">
                        <h2>Member Check</h2>
                        <span class="chip">Active</span>
                    </div>

                    <form id="clubForm">
                        <div class="field">
                            <label for="first_name">First name</label>
                            <input type="text" id="first_name" placeholder="Enter your first name" required>
                        </div>

                        <div class="field">
                            <label for="last_name">Last name</label>
                            <input type="text" id="last_name" placeholder="Enter your last name" required>
                        </div>

                        <button type="submit">Verify access</button>
                    </form>

                    <div id="result" class="result" aria-live="polite">Awaiting confirmation...</div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        const clubMembers = [
            "ethan castaneda",
            "kenzo cutamora",
            "briel lagran",
            "joaquin galura",
            "kyle dela calzada"
        ];

        const form = document.getElementById('clubForm');
        const result = document.getElementById('result');

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            const firstName = document.getElementById('first_name').value.trim();
            const lastName = document.getElementById('last_name').value.trim();

            if (!firstName || !lastName) {
                result.textContent = 'Please enter both names before verifying.';
                result.className = 'result error';
                return;
            }

            const candidate = `${firstName} ${lastName}`.toLowerCase();
            const isMember = clubMembers.includes(candidate);

            if (isMember) {
                result.textContent = `Congratulations, ${firstName} ${lastName}! You are a confirmed member of the Anti-Kenzo Club.`;
                result.className = 'result success';
            } else {
                result.textContent = `Sorry, ${firstName} ${lastName}. Your name is not on the approved resistance list.`;
                result.className = 'result error';
            }
        });
    </script>
</body>
</html>
